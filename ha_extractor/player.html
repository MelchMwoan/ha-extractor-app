<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HA Extractor</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    video,
    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted loop playsinline hidden>
    <source id="video-source" type="video/mp4">
    Your browser does not support video playback.
  </video>
  <img id="image" alt="Home Assistant dashboard" hidden>

  <script>
    var outputType = __OUTPUT_TYPE__;
    var sourceName = __SOURCE_NAME__;
    var versionName = __VERSION_NAME__;
    var media = document.getElementById(outputType === 'mp4' ? 'video' : 'image');
    var currentVersion = null;
    var loadingVersion = null;

    media.hidden = false;
    media.style.display = '';

    function preloadMedia(version) {
      var source = './' + sourceName + '?v=' + encodeURIComponent(version);
      loadingVersion = version;

      if (outputType === 'mp4') {
        var nextMedia = document.createElement('video');
        var swapped = false;
        nextMedia.autoplay = true;
        nextMedia.muted = true;
        nextMedia.loop = true;
        nextMedia.playsInline = true;
        nextMedia.controls = false;
        nextMedia.preload = 'auto';
        nextMedia.setAttribute('playsinline', '');
        nextMedia.style.display = 'none';
        nextMedia.src = source;
        var swapWhenReady = function () {
          if (swapped) return;
          swapped = true;
          if (loadingVersion !== version) return;
          nextMedia.style.display = '';
          if (media.replaceWith) media.replaceWith(nextMedia);
          else media.parentNode.replaceChild(nextMedia, media);
          media = nextMedia;
          currentVersion = version;
          try {
            var playback = nextMedia.play();
            if (playback && playback.catch) playback.catch(function () { });
          } catch (error) { }
        };
        nextMedia.addEventListener('loadeddata', swapWhenReady, false);
        nextMedia.addEventListener('canplay', swapWhenReady, false);
        nextMedia.addEventListener('error', function () {
          if (loadingVersion === version) loadingVersion = null;
        }, false);
        document.body.appendChild(nextMedia);
        nextMedia.load();
      } else {
        var nextImage = new Image();
        nextImage.onload = function () {
          if (loadingVersion !== version) return;
          media.src = source;
          currentVersion = version;
        };
        nextImage.onerror = function () {
          if (loadingVersion === version) loadingVersion = null;
        };
        nextImage.src = source;
      }
    }

    function handleVersion(version) {
      version = String(version).replace(/^\s+|\s+$/g, '');
      if (!version || version === currentVersion || version === loadingVersion) return;
      preloadMedia(version);
    }

    function checkForUpdate() {
      var request = new XMLHttpRequest();
      request.open('GET', './' + versionName + '?check=' + new Date().getTime(), true);
      request.onreadystatechange = function () {
        if (request.readyState !== 4) return;
        if (request.status >= 200 && request.status < 300) handleVersion(request.responseText);
      }
      request.send(null);
    }

    checkForUpdate();
    setInterval(checkForUpdate, 10000);
  </script>
</body>

</html>
