name: Create GitHub release

on:
  workflow_run:
    workflows:
      - Build and publish
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    name: Release from successful build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read version and changelog
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          app_version="$(sed -n 's/^version: *"\([^"]*\)".*/\1/p' ha_extractor/config.yaml | head -n 1)"

          if [[ -z "$app_version" ]]; then
            echo "Could not read version from ha_extractor/config.yaml" >&2
            exit 1
          fi

          awk -v version="$app_version" '
            $0 ~ "^## \\[" version "\\]( |$)" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' ha_extractor/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog entry found for $app_version" >&2
            exit 1
          fi

          echo "tag=v$app_version" >> "$GITHUB_OUTPUT"
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; refusing to move it."
            exit 1
          fi

          git tag --annotate "$RELEASE_TAG" "$RELEASE_SHA" --message "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "HA Extractor $RELEASE_VERSION" \
            --notes-file release-notes.md \
            --latest
